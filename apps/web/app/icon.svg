<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Eliora app icon: the logo's lightbulb rising off an open book, on the
       violet→pink brand gradient. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cd6"/>
      <stop offset="0.5" stop-color="#b95fc4"/>
      <stop offset="1" stop-color="#f0619f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fff3cd"/>
      <stop offset="1" stop-color="#f7c14b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#brand)"/>
  <!-- rays -->
  <g stroke="#fde9b8" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
    <path d="M32 6.5v4.5"/>
    <path d="M18.5 12.2l2.6 3.7"/>
    <path d="M45.5 12.2l-2.6 3.7"/>
    <path d="M12.4 24.5l4.3 1.4"/>
    <path d="M51.6 24.5l-4.3 1.4"/>
  </g>
  <!-- bulb glass -->
  <path d="M32 13.5c6.4 0 11.3 4.9 11.3 11 0 4.3-2.3 6.7-4 8.6-1.2 1.4-1.9 2.3-1.9 3.6h-10.8c0-1.3-.7-2.2-1.9-3.6-1.7-1.9-4-4.3-4-8.6 0-6.1 4.9-11 11.3-11z" fill="url(#glass)"/>
  <!-- filament -->
  <path d="M28.4 24.3l3.6 4.4 3.6-4.4" fill="none" stroke="#2a2350" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 28.7v4.6" stroke="#2a2350" stroke-width="2" stroke-linecap="round"/>
  <!-- screw base -->
  <rect x="27.6" y="38" width="8.8" height="3.2" rx="1.6" fill="#fdf4f2"/>
  <!-- open book -->
  <path d="M32 47.6c-3.6-3.1-8.4-4.2-13.6-4.2L9 52.4c6.6 0 15.9.9 23 5.1 7.1-4.2 16.4-5.1 23-5.1l-9.4-9c-5.2 0-10 1.1-13.6 4.2z" fill="#fdf4f2"/>
  <path d="M32 47.6v9.9" stroke="#e0cdf0" stroke-width="1.8" stroke-linecap="round"/>
</svg>
